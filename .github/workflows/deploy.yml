name: Build and Deploy TD Cloud Service to Cloud Run

on:
  push:
    branches:
      - main


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev

      - name: Build and Push TD Cloud Service
        run: |
          PROJECT_ID=$(echo "${{ secrets.GCP_PROJECT_ID }}" | tr -d '\n')
          IMAGE_NAME="europe-west1-docker.pkg.dev/${PROJECT_ID}/td-redis-repo/td-cloud-service:${{ github.sha }}"
          docker build -t "$IMAGE_NAME" ./td-cloud
          docker push "$IMAGE_NAME"

      - name: Deploy to Cloud Run
        run: |
          PROJECT_ID=$(echo "${{ secrets.GCP_PROJECT_ID }}" | tr -d '\n')
          IMAGE_NAME="europe-west1-docker.pkg.dev/${PROJECT_ID}/td-redis-repo/td-cloud-service:${{ github.sha }}"
          SERVICE_URL=$(gcloud run services describe td-cloud-service --region=europe-west1 --format='value(status.url)' 2>/dev/null || echo "https://td-cloud-service-placeholder.europe-west1.run.app")
          gcloud run deploy td-cloud-service \
            --image "$IMAGE_NAME" \
            --platform managed \
            --region europe-west1 \
            --allow-unauthenticated \
            --project "$PROJECT_ID" \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --set-env-vars "GCP_PROJECT_ID=${PROJECT_ID},REGION=europe-west1,SNAPSHOT_BUCKET=td-cloud-snapshots-gcp-ynov,TASK_QUEUE=game-events-queue,PROCESSOR_URL=${SERVICE_URL},RATE_LIMIT_PER_MIN=5,ADMIN_KEY=td-secret-2026,REDIS_HOST=127.0.0.1"
          