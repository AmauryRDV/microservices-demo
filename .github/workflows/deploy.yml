name: Build and Deploy TD Cloud Service to Cloud Run

on:
  push:
    branches:
      - main


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev

      - name: Build and Push TD Cloud Service
        run: |
          PROJECT_ID=$(echo "${{ secrets.GCP_PROJECT_ID }}" | tr -d '\n')
          IMAGE_NAME="europe-west1-docker.pkg.dev/${PROJECT_ID}/td-redis-repo/td-cloud-service:${{ github.sha }}"
          docker build -t "$IMAGE_NAME" ./td-cloud
          docker push "$IMAGE_NAME"

      - name: Deploy to Cloud Run
        run: |
          PROJECT_ID=$(echo "${{ secrets.GCP_PROJECT_ID }}" | tr -d '\n')
          IMAGE_NAME="europe-west1-docker.pkg.dev/${PROJECT_ID}/td-redis-repo/td-cloud-service:${{ github.sha }}"
          gcloud run deploy td-cloud-service \
            --image "$IMAGE_NAME" \
            --platform managed \
            --region europe-west1 \
            --allow-unauthenticated \
            --project "$PROJECT_ID" \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --set-env-vars "SNAPSHOT_BUCKET=td-cloud-snapshots,REDIS_HOST=redis-host"
          